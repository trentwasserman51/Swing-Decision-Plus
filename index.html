<meta name="apple-mobile-web-app-title" content="Swing Decision">
<meta name="application-name" content="Swing Decision Plus">
<meta name="theme-color" content="#0a1f44">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#0a1f44;--card:#12306b;--fg:#d6e4ff;--mut:#8fb0e8;--line:#24489a;--grass:#1d4ea8;--acc:#ffd23f;--accfg:#0a1f44;--good:#4ade80;--bad:#f87171;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 Barlow,system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:14px 14px 40px}
h1{font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 12px;letter-spacing:.5px;border-bottom:4px solid #ffd23f;padding-bottom:8px}
h2{font:700 24px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:14px 0 6px}
.row{display:flex;gap:8px}
select,input,button{font:inherit;color:inherit}
select,input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
nav{display:flex;gap:6px;margin:0 0 12px}
nav button{flex:1;font:700 18px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.5px}
svg{width:100%;height:auto;display:block;border-radius:10px;touch-action:manipulation;background:var(--card)}
.hint{color:var(--mut);font-size:14px;margin:8px 0}
.count{display:flex;align-items:baseline;gap:10px;margin:8px 0}
.count b{font:700 52px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.count span{color:var(--mut);font-size:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{min-height:40px;padding:6px 12px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:10px 0}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 2px}
.stat b{display:block;font:700 26px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.stat span{color:var(--mut);font-size:12px}
.note{background:var(--card);border-left:4px solid var(--acc);padding:10px 12px;border-radius:6px;margin:10px 0}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:13px}
th:first-child,td:first-child{text-align:left;font-weight:600}
td button.lnk{background:none;border:0;padding:6px 0;min-height:40px;text-align:left;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.bad{color:var(--bad);font-weight:600}.good{color:var(--good);font-weight:600}
li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);list-style:none}
li span{flex:1}ul{padding:0;margin:0}small{color:var(--mut)}

 if(el.id==='verified'){var cu=firebase.auth().currentUser;await cu.reload();if(cu.emailVerified){await cu.getIdToken(true);location.reload()}else toast('Not verified yet. Tap the link in the email.');return}
 if(el.id==='retry'){location.reload();return}
 if(el.id==='addp'||el.id==='addc'){var ne=$('#mem').value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(ne)){toast('Enter a valid email');return}try{await db.collection('members').doc(ne).set({role:el.id==='addc'?'coach':'player'});toast('Added '+ne)}catch(x){toast('Could not add')}return}
 if(d.rmmem){try{await db.collection('members').doc(d.rmmem).delete();toast('Removed')}catch(x){toast('Could not remove')}return}
 if(el.id==='demo'){if(!window.confirm('Add a Demo Season with a fake roster and at-bats?'))return;el.disabled=true;el.textContent='Loading demo data...';try{var dsid=await loadDemo(function(n){return db.collection(n)});toast('Demo Season added');season=dsid;tab='team';show()}catch(x){el.disabled=false;el.textContent='Load demo data';toast('Could not load demo data')}return}
 if(el.id==='delseason'){var dn=sName(season);if(!window.confirm('Permanently delete '+dn+'? This removes its roster and every at-bat. This cannot be undone.'))return;if(!window.confirm('Are you sure? '+dn+' will be gone for good.'))return;el.disabled=true;el.textContent='Deleting...';try{await deleteSeason(function(n){return db.collection(n)},season);season=null;pid=null;pvw='';cur={b:0,s:0,pitches:[]};fin=null;toast(dn+' deleted');show();window.scrollTo(0,0)}catch(x){el.disabled=false;el.textContent='Delete this season';toast('Could not delete. Try again.')}return}
 if(d.sort!==undefined){var si=+d.sort;if(sortI===si)sortD=-sortD;else{sortI=si;sortD=si===0?1:-1}show()}
 else if(d.restore){try{await db.collection('seasons').doc(d.restore).update({archived:false});toast('Season restored')}catch(x){toast('Could not restore')}}
 else if(el.id==='exs'){exportStats()}
 else if(el.id==='exp'){exportPitches()}
 else if(el.id==='rename'){var rn=$('#rn').value.trim();if(!rn){toast('Enter a season name');return}var rf=db.collection('seasons').doc(season);try{try{await rf.update({name:rn})}catch(e1){await rf.set({name:rn,at:0})}toast('Season renamed')}catch(x){toast('Could not rename')}}
 else if(el.id==='archive'){var rf2=db.collection('seasons').doc(season);try{try{await rf2.update({archived:true})}catch(e1){await rf2.set({name:sName(season),at:0,archived:true})}season=null;pid=null;pvw='';toast('Season archived');show()}catch(x){toast('Could not archive')}}
 else if(d.season){season=d.season;tab='team';pid=null;pvw='';pf='';cnt='All';ptf='All';selPk='';cur={b:0,s:0,pitches:[]};fin=null;lp='';show();window.scrollTo(0,0)}
 else if(d.home){if(cur.pitches.length)toast('Unfinished at-bat cleared');season=null;pid=null;pvw='';pf='';cur={b:0,s:0,pitches:[]};fin=null;show();window.scrollTo(0,0)}
 else if(el.id==='mkseason'){var sn=$('#sn').value.trim();if(!sn){toast('Enter a season name first');return}var src=$('#sc').value;
  try{var r=await db.collection('seasons').add({name:sn,at:Date.now()});
   if(src){var ps=allP.filter(function(p){return (p.season||LEG)===src});for(var i=0;i<ps.length;i++){await db.collection('players').add({name:ps[i].name,season:r.id})}}
   toast('Season created')}catch(x){toast('Could not create season')}}
 else if(d.tab){tab=d.tab;pid=null;pvw='';pf='';show()}
 else if(d.pid){pid=d.pid;pvw='';pf='';cnt='All';ptf='All';selPk='';show();window.scrollTo(0,0)}
 else if(d.back){pid=null;pvw='';pf='';show()}
 else if(d.clr){selPk='';show()}
 else if(d.pv){pvw=d.pv;pid=null;pf='';ptf='All';cnt='All';selPk='';show();window.scrollTo(0,0)}
 else if(d.pf!==undefined){pf=d.pf==='-'?'':d.pf;cnt='All';selPk='';show()}
 else if(d.cnt){cnt=d.cnt;show()}
 else if(d.ptf){ptf=d.ptf;show()}
 else if(d.frbi){fin.rbi=+d.frbi;show()}

 else if(d.ftog){var k=d.ftog;fin[k]=fin[k]?0:1;if((k==='sac'||k==='sf')&&fin[k])fin.qab=1;show()}
 else if(el.id==='finback'){var q=cur.pitches.pop();cur.b=q.b;cur.s=q.s;fin=null;show()}
 else if(el.id==='finsave'){try{await db.collection('abs').add({season:season,pid:lp,at:Date.now(),end:fin.end,pitcher:pit.trim(),rbi:fin.rbi,sac:fin.sac,sf:fin.sf,qab:fin.qab?1:0,pitches:cur.pitches});toast('At-bat saved: '+fin.end);cur={b:0,s:0,pitches:[]};fin=null}catch(x){toast('Could not save. Try again.')}show()}
 else if(d.pt){P.t=P.t===d.pt?'':d.pt;show()}
 else if(d.out){if(d.out==='ip'){P.ip=!P.ip;show()}else logPitch(d.out)}
 else if(d.q){P.q=P.q===d.q?'':d.q;show()}
 else if(d.res){logPitch('ip',d.res)}
 else if(d.del){try{await db.collection('abs').doc(d.del).delete()}catch(x){toast('Could not delete')}}
 else if(el.id==='undo'){var p=cur.pitches.pop();if(!p){toast('Nothing to undo');return}cur.b=p.b;cur.s=p.s;show()}
 else if(el.id==='newpa'){cur={b:0,s:0,pitches:[]};show()}
 else if(el.id==='savest'){var o={};SK.forEach(function(k){o[k[0]]=Math.max(0,parseInt($('#f_'+k[0]).value,10)||0)});try{await db.collection('players').doc(pid).update({st:o});toast('Stats saved')}catch(x){toast('Could not save stats')}}
 else if(el.id==='add'){var n=$('#nm').value.trim();if(!n){toast('Enter a name first');return}
  try{await db.collection('players').add({name:n,season:season});toast('Player added')}catch(x){toast('Could not add player')}}
});
document.addEventListener('change',function(e){if(e.target.id==='lp'){if(cur.pitches.length){toast('Finish or reset this at-bat first');show();return}lp=e.target.value}});
document.addEventListener('input',function(e){if(e.target.id==='pn')pit=e.target.value});
document.addEventListener('click',function(e){var c=e.target.closest('[data-pk]');if(c){var k=c.getAttribute('data-pk');selPk=selPk===k?'':k;show()}});
document.addEventListener('pointerdown',function(e){
 var s=e.target.closest('#pz');if(!s)return;
 var p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;var q=p.matrixTransform(s.getScreenCTM().inverse());
 P.x=Math.round(Math.max(2,Math.min(198,q.x)));P.y=Math.round(Math.max(2,Math.min(238,q.y)));show()});
(function(){
 if(!window.firebase||FIREBASE_CONFIG.apiKey.indexOf('PASTE')===0){ready='setup';show();return}
 firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();var subs=[];
 function rows(s){return s.docs.map(function(d){var o=d.data();o.id=d.id;return o})}
 firebase.auth().onAuthStateChanged(async function(u){
  subs.forEach(function(f){f()});subs=[];allP=[];allA=[];seasons=[];mem=[];canEdit=false;season=null;pid=null;pvw='';
  if(!u){me=null;ready='login';show();return}
  me=(u.email||'').toLowerCase();
  if(!u.emailVerified){ready='verify';show();return}
  ready=false;show();
  try{var m=await db.collection('members').doc(me).get();if(!m.exists){ready='noaccess';show();return}canEdit=m.data().role==='coach'}catch(e){ready='noaccess';show();return}
  subs.push(db.collection('players').onSnapshot(function(s){allP=rows(s);ready=true;show()},function(){ready='err';show()}));
  subs.push(db.collection('abs').onSnapshot(function(s){allA=rows(s).filter(function(a){return Array.isArray(a.pitches)});show()},function(){}));
  subs.push(db.collection('seasons').onSnapshot(function(s){seasons=rows(s);show()},function(){}));
  if(canEdit)subs.push(db.collection('members').onSnapshot(function(s){mem=rows(s);show()},function(){}));
 });
})();
show();
</script>
</body>
</html>
